name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "python[dev]"
      - run: pytest python/tests -q
      - run: python python/tests/package/verify_artifacts.py

  python-ddtrace-anthropic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "python[dev]" "ddtrace==4.13.1"
      - name: Datadog + MeterGraph Anthropic streaming composition
        env:
          DD_TRACE_ENABLED: "false"
        run: pytest python/tests/integrations/instrumentation/test_ddtrace_anthropic_composition.py -q

  python-litellm-otel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "python[otel]" "litellm[proxy]>=1.96.2,<2" pytest
      - run: pytest examples/python-litellm-otel/test_example.py -q

  python-phoenix-otel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "python[otel]" pytest
      - run: pytest examples/python-phoenix-otel/test_example.py -q

  python-langfuse-otel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "python[otel]" pytest
      - run: pytest examples/python-langfuse-otel/test_example.py -q

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm run test:package
        working-directory: typescript

  typescript-ai-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 18
            ai: 5
            fixture: ai-sdk-v5.types.ts
          - node: 18
            ai: 6
            fixture: ai-sdk-current.types.ts
          - node: 22
            ai: 7
            fixture: ai-sdk-current.types.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
        working-directory: typescript
      - run: npm install --no-save ai@${{ matrix.ai }}
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext test/${{ matrix.fixture }}
        working-directory: typescript
      - run: AI_SDK_MAJOR=${{ matrix.ai }} node --test --test-name-pattern="Vercel" test/*.test.mjs
        working-directory: typescript
      - if: matrix.ai == 7
        run: npm install
        working-directory: examples/node-vercel-ai-registry
      - if: matrix.ai == 7
        run: npm test
        working-directory: examples/node-vercel-ai-registry
      - if: matrix.ai == 7
        run: npm install
        working-directory: examples/node-vercel-ai-existing-factory
      - if: matrix.ai == 7
        run: npm test
        working-directory: examples/node-vercel-ai-existing-factory

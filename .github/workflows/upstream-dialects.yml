# Drift watch for the telemetry dialects the GenAI exporter maps.
#
# Every other mapper test hand-writes span attributes, so it only proves the
# mapper handles a vocabulary we wrote down. This job drives the REAL Phoenix
# and Langfuse libraries and asserts on the spans they actually produce, so an
# upstream rename surfaces here instead of as silent capture loss in the field.
#
# Deliberately NOT part of ci.yml and NOT a required check: the dependencies
# are unpinned so the job can see drift, which means an upstream release can
# turn it red without any change on our side. That is news worth having, not a
# reason to block an unrelated merge.
name: upstream-dialects

on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  upstream-dialects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unpinned on purpose: pinning these would defeat the whole job.
      - run: >
          pip install -e "python[otel]" pytest
          openinference-instrumentation-openai openai langfuse langsmith httpx
      - name: Record the versions this run actually tested
        run: pip list | grep -Ei "openinference|langfuse|langsmith|^openai|opentelemetry-sdk"
      - name: Upstream SDKs still emit the attributes the mapper reads
        run: >
          pytest python/tests/integrations/instrumentation/test_upstream_dialects.py
          -q -rs
